name: Documentation site

on:
  push:
    branches: [main]
    paths:
      [
        "site/**",
        "docs/**",
        "awx_lab/__init__.py",
        ".github/workflows/pages.yml",
      ]
  pull_request:
    paths:
      [
        "site/**",
        "docs/**",
        "awx_lab/__init__.py",
        ".github/workflows/pages.yml",
      ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci --prefix site
      - run: npm run build --prefix site
        env:
          SITE_BASE_PATH: ${{ vars.SITE_BASE_PATH || '/awx-lab/' }}
      - run: npm run check --prefix site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site/_site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && vars.PAGES_ENABLED == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
