name: CLI tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Unit and local Git integration tests
        run: python -m unittest discover -s tests -v
      - name: Build distribution and verify installation outside checkout
        run: |
          python -m pip install '.[dev]'
          python -m build --outdir "$RUNNER_TEMP/awx-lab-dist"
          python scripts/check_install.py "$RUNNER_TEMP"/awx-lab-dist/*.whl
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: awx-lab-dist-${{ matrix.os }}-${{ matrix.python }}
          path: ${{ runner.temp }}/awx-lab-dist/*
          retention-days: 7
